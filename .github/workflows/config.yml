name: CI (Config Package)

on:
  push:
    branches: [main]
    paths:
      - '*'
      - .changeset/**
      - docs/**
      - .github/workflows/**
      - .woodpecker/**
      - packages/config/**
      - examples/**
  pull_request:
    branches: [main]
    paths:
      - '*'
      - .changeset/**
      - docs/**
      - .github/workflows/**
      - .woodpecker/**
      - packages/config/**
      - examples/**

permissions:
  contents: read

jobs:
  test-and-build:
    name: Config checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check editor schema
        run: pnpm schema:check
      - name: Build config
        run: pnpm --filter '@goto/config...' build
      - name: Check types
        run: pnpm --filter @goto/config check
      - name: Lint config
        run: pnpm --filter @goto/config lint
      - name: Unit tests
        run: pnpm --filter @goto/config test:coverage
