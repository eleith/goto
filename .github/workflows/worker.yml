name: CI/CD (Worker Service)

on:
  push:
    branches: [main]
    tags: ['@goto/worker@*']
    paths:
      - '*'
      - .changeset/**
      - .github/workflows/**
      - .woodpecker/**
      - apps/worker/**
      - packages/config/**
      - tools/**
  pull_request:
    branches: [main]
    paths:
      - '*'
      - .changeset/**
      - .github/workflows/**
      - .woodpecker/**
      - apps/worker/**
      - packages/config/**
      - tools/**

permissions:
  contents: read

jobs:
  check:
    name: Worker checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check editor schema
        run: pnpm schema:check
      - name: Build worker and dependencies
        run: pnpm --filter '@goto/worker...' build
      - name: Check types
        run: pnpm --filter @goto/worker check
      - name: Lint worker
        run: pnpm --filter @goto/worker lint
      - name: Unit tests
        run: pnpm --filter @goto/worker test:coverage
      - name: Compiled service smoke test
        run: pnpm --filter @goto/worker test:smoke

  build-push:
    name: Publish worker image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/@goto/worker@'))
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const tag = process.env.GITHUB_REF_NAME ?? '';
          const version = JSON.parse(readFileSync('apps/worker/package.json', 'utf8')).version;
          const stableVersion = /^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$/;
          if (!stableVersion.test(version) || tag !== '@goto/worker@' + version) {
            throw new Error('Expected a stable @goto/worker@<version> tag matching apps/worker/package.json');
          }
          NODE
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eleith/goto-worker
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=^@goto/worker@(\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^@goto/worker@(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=^@goto/worker@(\d+)\.\d+\.\d+$,group=1
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
