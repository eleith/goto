services:
  goto-app:
    image: goto:dev
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /m/apps/web
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 5173
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./config:/m/apps/web/config:ro
      - ./src:/m/apps/web/src:ro
      - ./vite.config.ts:/m/apps/web/vite.config.ts:ro
      - ./tsconfig.json:/m/apps/web/tsconfig.json:ro
      - ../../packages/config/src:/m/packages/config/src:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - fetch('http://localhost:5173/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3

  goto-cli:
    image: goto-cli:dev
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: apps/cli/Dockerfile
      target: prod
    profiles:
      - tools
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 5173
    volumes:
      - ./config:/app/config:ro
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
