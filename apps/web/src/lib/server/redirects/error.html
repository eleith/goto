<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%error.heading% — Goto</title>
		<link rel="icon" href="%error.origin%/@static/favicon.svg" type="image/svg+xml" sizes="any" />
		<meta name="description" content="Quick links. To get there. Quickly." />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Goto" />
		<meta property="og:site_name" content="Goto" />
		<meta property="og:description" content="Quick links. To get there. Quickly." />
		<meta property="og:url" content="%error.origin%/" />
		<meta property="og:image" content="%error.origin%/@static/og.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Goto — Quick links. To get there. Quickly." />
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
				color: light-dark(#1c3039, #e0eaee);
			}

			body {
				margin: 0;
			}

			main {
				box-sizing: border-box;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 1rem;
				min-height: 100svh;
				padding: 2rem 1rem;
				background: light-dark(#d9e3e7, #13232b);
				text-align: center;
			}

			.app-icon {
				display: block;
				width: clamp(5rem, 15vw, 7rem);
				height: auto;
			}

			h1 {
				margin: 0;
				font-size: clamp(1.75rem, 5vw, 2.5rem);
				line-height: 1.2;
				overflow-wrap: anywhere;
			}
		</style>
	</head>
	<body>
		<main>
			<img class="app-icon" src="/@static/favicon.svg" alt="Goto" />
			<h1>%error.heading%</h1>
		</main>
	</body>
</html>
