services:
  goto-app:
    image: ghcr.io/eleith/goto:latest
    platform: linux/amd64
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      goto-worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  goto-worker:
    image: ghcr.io/eleith/goto-worker:latest
    platform: linux/amd64
    env_file: .env
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - fetch('http://localhost:9000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
