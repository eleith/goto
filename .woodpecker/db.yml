workspace:
  base: /workspace
  path: src

when:
  - event: push
    branch: main
    path:
      include:
        - '*'
        - .changeset/**
        - .github/workflows/**
        - .woodpecker/**
        - packages/db/**
        - packages/config/**
        - scripts/**
        - tools/**
  - event: pull_request
    branch: main
    path:
      include:
        - '*'
        - .changeset/**
        - .github/workflows/**
        - .woodpecker/**
        - packages/db/**
        - packages/config/**
        - scripts/**
        - tools/**

steps:
  prepare:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - corepack install --global pnpm@11.9.0
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile

  build:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - pnpm --filter '@goto/db...' build

  lint:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - pnpm --filter @goto/db check
      - pnpm --filter @goto/db lint
      - pnpm exec prettier --check scripts
      - pnpm exec eslint scripts

  test:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - pnpm --filter @goto/db test:coverage
      - pnpm test:scripts
