workspace:
  base: /workspace
  path: src

when:
  - event: push
    branch: main
    path:
      include:
        - '*'
        - .changeset/**
        - docs/**
        - .github/workflows/**
        - .woodpecker/**
        - apps/web/**
        - packages/**
  - event: pull_request
    path:
      include:
        - '*'
        - .changeset/**
        - docs/**
        - .github/workflows/**
        - .woodpecker/**
        - apps/web/**
        - packages/**
  - event: tag
    ref: 'refs/tags/@goto/web@*'

steps:
  prepare:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - corepack install --global pnpm@11.9.0
      - pnpm config set store-dir .pnpm-store
      - pnpm install --frozen-lockfile
      - pnpm build:packages

  lint:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - pnpm --filter @goto/web check
      - pnpm lint

  test:
    image: node:26.5.0-bookworm
    environment:
      COREPACK_HOME: /workspace/src/.pnpm-store/corepack
    commands:
      - npm install --global corepack@0.36.0
      - corepack enable
      - pnpm --filter @goto/web test:coverage

  e2e:
    image: git.eleith.com/eleith.private/playwright:1.61.1-node26
    commands:
      - node --version
      - pnpm --version
      - node --eval "if (process.versions.node !== '26.5.0') throw new Error('Expected Node 26.5.0')"
      - test "$(pnpm --version)" = "11.9.0"
      - pnpm test:e2e

  check-version-and-extract-tags:
    image: node:26.5.0-bookworm
    commands:
      - |
        node --input-type=module <<'NODE'
        import { readFileSync, writeFileSync } from 'node:fs';

        const tag = process.env.CI_COMMIT_TAG ?? '';
        const version = JSON.parse(readFileSync('apps/web/package.json', 'utf8')).version;
        const stableVersion = /^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$/;
        if (!stableVersion.test(version) || tag !== '@goto/web@' + version) {
          throw new Error('Expected a stable @goto/web@<version> tag matching apps/web/package.json');
        }
        const [major, minor] = version.split('.');
        writeFileSync('.tags', [version, major + '.' + minor, major].join('\n') + '\n');
        NODE
    when:
      - event: tag
        ref: 'refs/tags/@goto/web@*'

  build-docker-main:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith.private/goto
      username: eleith
      registry: https://git.eleith.com
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      platforms: linux/amd64
      tags:
        - latest
      password:
        from_secret: gitea_docker_registry
    when:
      - event: push
        branch: main

  build-docker-tag:
    image: woodpeckerci/plugin-docker-buildx:6.0.3
    settings:
      repo: git.eleith.com/eleith.private/goto
      username: eleith
      registry: https://git.eleith.com
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
      platforms: linux/amd64
      tags_file: .tags
      password:
        from_secret: gitea_docker_registry
    when:
      - event: tag
        ref: 'refs/tags/@goto/web@*'

  notify-success:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: success
      recipients_only: true
    when:
      - event: [push, tag]
        status: [success]

  notify-failure:
    image: deblan/woodpecker-email:3.2.0
    settings:
      dsn:
        from_secret: woodpecker_email_dsn
      from:
        address:
          from_secret: woodpecker_email_from_address
        name:
          from_secret: woodpecker_email_from_name
      recipients:
        from_secret: woodpecker_email_recipient
      level: failure
      recipients_only: true
    when:
      - event: [push, tag]
        status: [failure]
