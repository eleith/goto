# yaml-language-server: $schema=https://goto.example.net/schema.json
version: 1

url:
  app: https://goto.example.net
  worker: http://goto-worker:9000

site:
  title: Goto

appearance:
  primary_light_color: '#0f766e'
  primary_dark_color: '#5eead4'

auth:
  secret: '${GOTO_AUTH_SECRET}'
  oidc:
    issuer: https://identity.example.net
    client_id: goto
    client_secret: '${GOTO_OIDC_CLIENT_SECRET}'

database:
  path: ./data/goto.sqlite
  worker_path: ./data/worker.sqlite

analytics:
  retention_months: 3

link_defaults:
  status_code: 302
  case_insensitive: true
  ignore_trailing_slash: true
  forward_path: false
  forward_query: false

fallback:
  url: https://example.net/unavailable
  status_code: 307
  forward_query: true

domains:
  go.example.org:
    link_defaults:
      status_code: 307
      forward_query: true
    root:
      url: https://example.org
      status_code: 308
    fallback:
      url: https://example.org/unavailable
    links:
      /docs:
        url: https://example.org/documentation
        title: Documentation
        tags: [work]
        forward_path: true
        forward_query: false
      /download:
        url: https://example.org/download
        redirect:
          - if:
              language: fr
              os: ios
            to: https://apps.example.org/fr/ios
          - if:
              os: ios
            to: https://apps.example.org/ios
      /café:
        url: https://example.org/cafe
      /paused:
        url: https://example.org/maintenance
        enabled: false
      /launch:
        url: https://example.org/launch
        valid_from: '2027-01-01T00:00:00Z'
        valid_until: '2027-02-01T00:00:00Z'
  tiny.example.com:
    links:
      /docs:
        url: https://another.example.com/docs
